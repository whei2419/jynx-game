<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Start Game</title>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="hand-tracking.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .buttoncontainer {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
        }

        .score-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: white;
            border-radius: 15px;
            padding: 30px 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            min-width: 200px;
        }

        .your-score {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: normal;
        }

        #score {
            font-size: 80px;
            color: #00A86B;
            font-weight: bold;
            margin: 10px 0;
            line-height: 1;
        }

        .POINTS {
            font-size: 24px;
            color: #00A86B;
            font-weight: bold;
            margin-top: 5px;
            text-transform: uppercase;
        }
    </style>

    <script>
        let selectedLang = ''; // default

        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang');
            const score = parseInt(params.get('score')) || 0;

            const body = document.body;
            const startButton = document.getElementById('startButton');
            const scoreDisplay = document.getElementById('score');
            const startButtonLink = document.getElementById('startButtonLink');
            const startButtonText = document.getElementById('startButtonText');

            scoreDisplay.textContent = score;

            // Store score temporarily for later use in name input
            localStorage.setItem('currentGameScore', score);

            if (lang === 'chinese') {
                body.style.backgroundImage = "url('assets/ch-end.png')";
                startButtonText.innerText = "完成"; // "Finish" in Chinese
                selectedLang = 'chinese';
            } else {
                body.style.backgroundImage = "url('assets/dutch/finish.webp')";
                startButtonText.innerText = "Continue";
                selectedLang = 'english';
            }

            // Set the destination for the hand-tracking dwell-to-click
            startButtonLink.href = `name-input.html?lang=${selectedLang}&score=${score}`;

            startButtonLink.addEventListener('click', function (e) {
                e.preventDefault(); // Prevent default link behavior
                const clickSound = new Audio('assets/SOUNDTRACK/select-sound.mp3');
                const completeSound = new Audio('assets/SOUNDTRACK/completed.mp3');
                clickSound.play();
                completeSound.play();
                // Navigate after a short delay to allow sound to play
                setTimeout(() => {
                    window.location.href = `name-input.html?lang=${selectedLang}&score=${score}`;
                }, 200); // 200ms delay
            });

            initHandTracking();
        }
    </script>
</head>

<body>
    <div id="text-loader">Loading...</div>
    <div id="hand-cursor" class="hand-cursor"></div>
    <div id="debug">
        <video id="video" playsinline></video>
        <canvas id="output" style="display: none;"></canvas>
    </div>
    <div class="score-container">
        <div class="your-score">YOUR SCORE</div>
        <div id="score">0</div>
        <div class="POINTS">POINTS</div>
    </div>

    <div class="buttoncontainer">
        <a id="startButtonLink" href="index.html" class="start-button" data-hover-effect="true">
            <span id="startButtonText"></span>
            <div class="progress-bar"></div>
        </a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="hand-tracking.js"></script>
</body>
</html>
