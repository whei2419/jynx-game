<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Start Game</title>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="hand-tracking.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .start-button {
            display: none;
        }

        .cotton-video {
                position: absolute;
        top: 51%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        max-width: 92vw;
        height: auto;
        border-radius: 20px;
        z-index: 10;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);

        }

        .video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: -1;
        }

        .fade-in {
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Loader styles */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
    </style>

    <script>
        let selectedLang = ''; // default
        let hoverTimer = null;

        window.onload = function () {
            const textLoader = document.getElementById('text-loader');
            textLoader.style.display = 'block'; // Show loader immediately

            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang');

            const body = document.body;

            if (lang === 'chinese') {
                body.style.backgroundImage = "url('assets/startcn.png')";
                selectedLang = 'chinese';
            } else {
                body.style.backgroundImage = "url('assets/dutch/index.webp')"; 
                selectedLang = 'english';
            }

            initHandTracking();

            // Add click event to entire page to go to join page
            document.addEventListener('click', function() {
                window.location.href = `join.html`;
            });
        }
    </script>
</head>

<body>
    <div id="text-loader">Loading...</div>
    <video class="cotton-video" autoplay loop muted playsinline>
        <source src="assets/video/cotton.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div id="hand-cursor" class="hand-cursor"></div>
    <div id="debug">
        <video id="video" playsinline></video>
        <canvas id="output"></canvas>
    </div>

    <div id="text-loader" style="display: none;">Loading Hand Tracking...</div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="hand-tracking.js"></script>
</body>

</html>
