<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Start Game</title>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="hand-tracking.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 1s ease-in-out;
        }

        .start-button {
            display: none;
        }

        .cotton-video {
            position: absolute;
            top: 51%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 92vw;
            height: auto;
            border-radius: 20px;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: -1;
        }

        .fade-in {
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Loader styles */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
    </style>

    <script>
        let selectedLang = ''; // default
        let hoverTimer = null;
        let currentVideoIndex = 0;
        const videos = [
            { src: 'assets/video/cotton.mp4', background: 'assets/dutch/index.webp' },
            { src: 'assets/video/cotton2.mp4', background: 'assets/dutch/index1.webp' }
        ];

        function updateBackgroundForVideo() {
            const body = document.body;
            const video = document.querySelector('.cotton-video');
            
            // Set background based on current video with smooth transition
            body.style.backgroundImage = `url('${videos[currentVideoIndex].background}')`;
        }

        function playNextVideo() {
            const video = document.querySelector('.cotton-video');
            console.log('Playing next video, currentVideoIndex:', currentVideoIndex);
            if (video && currentVideoIndex < videos.length - 1) {
                currentVideoIndex++;
                console.log('Switching to video:', videos[currentVideoIndex].src);
                
                // Update background smoothly
                updateBackgroundForVideo();
                
                // Change video source immediately
                video.src = videos[currentVideoIndex].src;
                video.load();
                video.play();
            }
        }

        window.onload = function () {
            // const textLoader = document.getElementById('text-loader');
            // textLoader.style.display = 'block'; // Show loader immediately

            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang');

            const body = document.body;

            if (lang === 'chinese') {
                body.style.backgroundImage = "url('assets/startcn.png')";
                selectedLang = 'chinese';
            } else {
                // Set initial background for first video
                body.style.backgroundImage = `url('${videos[0].background}')`;
                selectedLang = 'english';
            }

            const video = document.querySelector('.cotton-video');
            if (video) {
                // Add event listener for when video ends
                video.addEventListener('ended', function() {
                    console.log('Video ended, currentVideoIndex:', currentVideoIndex);
                    
                    if (currentVideoIndex === 0) {
                        // First video ended, play second video
                        playNextVideo();
                    } else if (currentVideoIndex === 1) {
                        // Second video ended, return to first video and loop
                        currentVideoIndex = 0;
                        console.log('Returning to first video');
                        
                        // Update background smoothly
                        updateBackgroundForVideo();
                        
                        // Change video source immediately
                        video.src = videos[currentVideoIndex].src;
                        video.load();
                        video.play();
                    }
                });
            }


            // Add click event to entire page to go to join page
            document.addEventListener('click', function() {
                window.location.href = `join.html`;
            });
        }
    </script>
</head>

<body>
    <!-- <div id="text-loader">Loading...</div> -->
    <video class="cotton-video" autoplay muted playsinline>
        <source src="assets/video/cotton.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <div id="hand-cursor" class="hand-cursor"></div>
    <div id="debug">
        <video id="video" playsinline></video>
        <canvas id="output"></canvas>
    </div>

    <!-- <div id="text-loader" style="display: none;">Loading Hand Tracking...</div> -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <!-- <script src="hand-tracking.js"></script> -->
</body>

</html>
