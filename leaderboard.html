<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard</title>
    <link rel="stylesheet" href="font.css" />
    <link rel="stylesheet" href="hand-tracking.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: linear-gradient(135deg, #6dd5c7 0%, #4fb8a8 100%);
        background-size: cover;
        background-position: center;
        position: relative;
        font-family: Arial, sans-serif;
      }

      .cotton-decoration {
        display: none;
      }

      .logo-container {
        display: none;
      }

      .logo {
        display: none;
      }

      .logo-text {
        display: none;
      }

      .leaderboard-container {
        position: absolute;
           top: 30%;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border-radius: 20px;
        padding: 30px 40px;
        padding-top: 80px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        width: 70vw;
        max-height: 65vh;
        overflow-y: auto;
        z-index: 10;
      }

      .leaderboard-title {
        color: #00a86b;
        font-size: 32px;
        font-weight: bold;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 15px;
        letter-spacing: 2px;
      }

      .reset-info {
        text-align: center;
        color: #666;
        font-size: 12px;
        margin-bottom: 20px;
        padding: 8px;
        background: #f8f8f8;
        border-radius: 8px;
        border-left: 3px solid #00a86b;
      }

      .leaderboard-item {
        display: flex;
        align-items: center;
        padding: 12px 15px;
        margin-bottom: 8px;
        border-radius: 15px;
        color: white;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      .leaderboard-item.rank-1 {
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF6347 100%);
        box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 165, 0, 0.4);
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(255, 215, 0, 0.8);
      }

      .leaderboard-item.rank-1 .rank-number {
        font-size: 40px;
        width: 60px;
        height: 60px;
        animation: crownBounce 2s ease-in-out infinite;
      }

      @keyframes crownBounce {
        0%, 100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-5px) scale(1.1);
        }
      }

      .leaderboard-item.rank-1 .player-name {
        font-size: 32px;
      }

      .leaderboard-item.rank-1 .player-score {
        font-size: 32px;
        position: relative;
      }

      .fire-background {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 60px;
        z-index: 0;
        animation: fireFlicker 1.2s ease-in-out infinite alternate;
        opacity: 0.9;
        filter: drop-shadow(0 0 8px rgba(255, 165, 0, 0.8));
      }

      @keyframes fireFlicker {
        0% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0.7;
          filter: drop-shadow(0 0 8px rgba(255, 165, 0, 0.6));
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 1.0;
          filter: drop-shadow(0 0 12px rgba(255, 165, 0, 1.0));
        }
        100% {
          transform: translate(-50%, -50%) scale(1.0);
          opacity: 0.9;
          filter: drop-shadow(0 0 10px rgba(255, 165, 0, 0.8));
        }
      }

      .leaderboard-item.rank-2 {
        background: linear-gradient(135deg, #F0F8FF 0%, #C0C0C0 50%, #87CEEB 100%);
        box-shadow: 0 8px 25px rgba(192, 192, 192, 0.6), 0 0 20px rgba(192, 192, 192, 0.4);
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(192, 192, 192, 0.8);
      }

      .leaderboard-item.rank-2 .rank-number {
        font-size: 38px;
        width: 58px;
        height: 58px;
        animation: medalSway 2.5s ease-in-out infinite;
      }

      @keyframes medalSway {
        0%, 100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg) scale(1.05);
        }
      }

      .leaderboard-item.rank-2 .player-name {
        font-size: 30px;
      }

      .leaderboard-item.rank-2 .player-score {
        font-size: 30px;
      }

      .leaderboard-item.rank-3 {
        background: linear-gradient(135deg, #DEB887 0%, #CD853F 50%, #D2691E 100%);
        box-shadow: 0 8px 25px rgba(222, 184, 135, 0.6), 0 0 20px rgba(205, 133, 63, 0.4);
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(222, 184, 135, 0.8);
      }

      .leaderboard-item.rank-3 .rank-number {
        font-size: 36px;
        width: 56px;
        height: 56px;
        animation: medalSway 3s ease-in-out infinite;
      }

      .leaderboard-item.rank-3 .player-name {
        font-size: 28px;
      }

      .leaderboard-item.rank-3 .player-score {
        font-size: 28px;
      }

      .leaderboard-item.rank-other {
        background: linear-gradient(135deg, #00a86b 0%, #008f5a 100%);
      }

      .rank-number {
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 15px;
        font-weight: bold;
        font-size: 25px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.6);
        position: relative;
      }

      .rank-number.rank-1-image {
        background: url('assets/dutch/rank1.webp') center center;
        background-size: contain;
        background-repeat: no-repeat;
        border: none;
        border-radius: 0;
        color: white;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        font-size: 18px;
      }

      .rank-number.rank-2-image {
        background: url('assets/dutch/rank2.webp') center center;
        background-size: contain;
        background-repeat: no-repeat;
        border: none;
        border-radius: 0;
        color: white;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        font-size: 18px;
      }

      .rank-number.rank-3-image {
        background: url('assets/dutch/rank3.webp') center center;
        background-size: contain;
        background-repeat: no-repeat;
        border: none;
        border-radius: 0;
        color: white;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        font-size: 18px;
      }

      .rank-number.cloud-shape {
        background: url('assets/dutch/rank4.webp') center center;
        background-size: contain;
        background-repeat: no-repeat;
        border: none;
        border-radius: 0;
        color: white;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        font-size: 20px;
      }

      .rank-number.cloud-shape::before,
      .rank-number.cloud-shape::after {
        display: none;
      }

      .rank-other {
        background: #64DDC6 !important;
      }

      .player-name {
        font-size: 25px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
      }

      .player-score {
        font-size: 25px;
        font-weight: bold;
        margin-left: auto;
        color: #fff;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
      }

      .start-button {
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
      }

      .start-button:hover {
        background: #008f5a;
        transform: translateY(-2px);
      }

      .buttoncontainer {
        position: absolute;
        bottom: 6%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }

      .logo-top {
        position: absolute;
        top: 4%;
        left: 50%;
        transform: translateX(-50%);
        width: 348px;
        height: auto;
        object-fit: contain;
        z-index: 1;
      }

      .leaderboard-text {
        position: absolute;
        top: 21%;
        left: 50%;
        transform: translateX(-50%);
        width: 46%;
        height: auto;
        object-fit: contain;
        z-index: 22;
      }
      .leaderboard-cotton {
        position: absolute;
        top: 26%;
        left: 50%;
        transform: translateX(-50%);
        width: 25%;
        height: auto;
        object-fit: contain;
        z-index: 23;
      }
    </style>
  </head>

  <body>
    <img class="logo-top" src="assets/dutch/logo.webp" alt="" />
    <img
      class="leaderboard-text"
      src="assets/dutch/leader-board-text.png"
      alt=""
    />
    <img
      class="leaderboard-cotton"
      src="assets/dutch/leaderboard-cotton.png"
      alt=""
    />
    <!-- <div id="text-loader">Loading...</div> -->
    <div id="hand-cursor" class="hand-cursor"></div>
    <div id="debug">
      <video id="video" playsinline></video>
      <canvas id="output" style="display: none"></canvas>
    </div>

    <div class="leaderboard-container" id="leaderboardContainer">
      <div class="leaderboard-title"></div>
      <!-- Leaderboard items will be populated here -->
    </div>

    <div class="buttoncontainer">
      <a id="finishButtonLink" href="index.html" class="start-button">
        <span id="finishButtonText" class="button-text">FINISH</span>
      </a>
    </div>

    <script>
      let selectedLang = "english";

      // Function to check if leaderboard should be reset daily
      function checkDailyReset() {
        const today = new Date().toDateString(); // Get current date as string (e.g., "Mon Aug 07 2025")
        const lastResetDate = localStorage.getItem("lastLeaderboardReset");

        if (lastResetDate !== today) {
          // New day detected, clear the leaderboard
          localStorage.removeItem("gameLeaderboard");
          localStorage.setItem("lastLeaderboardReset", today);
          console.log("Daily leaderboard reset performed for:", today);
        }
      }

      // Function to get leaderboard from localStorage
      function getLeaderboardFromStorage() {
        // Check for daily reset first
        checkDailyReset();

        let leaderboard =
          JSON.parse(localStorage.getItem("gameLeaderboard")) || [];
        return leaderboard.sort((a, b) => b.score - a.score).slice(0, 10); // Top 10 players
      }

      function populateLeaderboard() {
        const container = document.getElementById("leaderboardContainer");

        // Start with empty container
        container.innerHTML = '';

        // Add reset information
        const today = new Date().toDateString();
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowString = tomorrow.toDateString();

        // container.innerHTML += `
        //         <div class="reset-info">
        //             Today's leaderboard • Resets daily at midnight<br>
        //             <small>Next reset: ${tomorrowString}</small>
        //         </div>
        //     `;

        // Get leaderboard from localStorage
        const leaderboardData = getLeaderboardFromStorage();

        if (leaderboardData.length === 0) {
          // Show empty state
          container.innerHTML += `
                    <div style="text-align: center; color: #666; padding: 40px 20px; font-size: 18px;">
                        <p>No scores yet!</p>
                        <p style="font-size: 14px; margin-top: 10px;">Play the game to appear on the leaderboard.</p>
                    </div>
                `;
          return;
        }

        leaderboardData.forEach((player, index) => {
          const rank = index + 1;
          const item = document.createElement("div");
          item.className = "leaderboard-item";

          // Add rank-specific styling
          if (rank === 1) {
            item.classList.add("rank-1");
          } else if (rank === 2) {
            item.classList.add("rank-2");
          } else if (rank === 3) {
            item.classList.add("rank-3");
          } else {
            item.classList.add("rank-other");
          }

          // Determine rank class and display
          let rankClass = '';
          let rankDisplay = rank;
          
          if (rank === 1) {
            rankClass = 'rank-1-image';
            rankDisplay = '';
          } else if (rank === 2) {
            rankClass = 'rank-2-image';
            rankDisplay = '';
          } else if (rank === 3) {
            rankClass = 'rank-3-image';
            rankDisplay = '';
          } else {
            rankClass = 'cloud-shape';
          }

          item.innerHTML = `
                    <div class="rank-number ${rankClass}">${rankDisplay}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-score">
                        ${player.score}
                    </div>
                `;

          container.appendChild(item);
        });
      }

      // Function to clear leaderboard (for testing purposes)
      function clearLeaderboard() {
        localStorage.removeItem("gameLeaderboard");
        populateLeaderboard();
      }

      window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        const lang = params.get("lang");
        const finishButtonLink = document.getElementById("finishButtonLink");
        const finishButtonText = document.getElementById("finishButtonText");

        const body = document.body;

        if (lang === "chinese") {
          selectedLang = "chinese";
          body.style.backgroundImage = "url('assets/startcn.png')";
          finishButtonText.innerText = "完成";

          // Update reset info for Chinese
          setTimeout(() => {
            const resetInfo = document.querySelector(".reset-info");
            if (resetInfo) {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              const tomorrowString = tomorrow.toLocaleDateString("zh-CN");
              resetInfo.innerHTML = `
                            今日排行榜 • 每日午夜重置<br>
                            <small>下次重置: ${tomorrowString}</small>
                        `;
            }
          }, 100);
        } else {
          selectedLang = "english";
          body.style.backgroundImage = "url('assets/dutch/start1.webp')";
          finishButtonText.innerText = "FINISH";
        }

        // Populate leaderboard from localStorage
        populateLeaderboard();

        finishButtonLink.addEventListener("click", function (e) {
          e.preventDefault();
          const clickSound = new Audio("assets/SOUNDTRACK/select-sound.mp3");
          const completeSound = new Audio("assets/SOUNDTRACK/completed.mp3");
          clickSound.play();
          completeSound.play();

          setTimeout(() => {
            window.location.href = `index.html?lang=${selectedLang}`;
          }, 200);
        });

        // initHandTracking();
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <!-- <script src="hand-tracking.js"></script> -->
  </body>
</html>
